<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    #task-input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      cursor: pointer;
    }
    .filters {
      margin-bottom: 15px;
      text-align: center;
    }
    .filters button {
      margin: 0 5px;
    }
    .filters button.active {
      background-color: #4CAF50;
      color: white;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      margin-bottom: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 6px;
    }
    li.completed span {
      text-decoration: line-through;
      color: gray;
    }
    .delete-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>My To-Do List</h1>

  <div class="input-section">
    <input type="text" id="task-input" placeholder="Write a new task...">
    <button id="add-btn">Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <ul id="task-list"></ul>

  <script src="script.js"></script>
</body>
</html>
